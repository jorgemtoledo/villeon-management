services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-villeon_development}
    # Not published to the host on purpose: only backend/sidekiq talk to it,
    # over the compose network by service name ("db"). Publishing 5432 to
    # the host risks colliding with another project's Postgres already
    # bound to that same port on a shared VPS.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Same reasoning as db above — internal-only, same compose network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3010"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
    ports:
      - "3010:3010"
    volumes:
      - ./backend:/app
      # Read-only: source spreadsheets for data imports (e.g. rake products:import).
      - ./docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    build: ./backend
    command: ["bundle", "exec", "sidekiq"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the client JS bundle at `next
        # build` time, so this must be a build arg — env_file/environment:
        # below has no effect on it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://187.77.236.3:3010}
    env_file:
      - .env
    ports:
      - "3011:3011"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
